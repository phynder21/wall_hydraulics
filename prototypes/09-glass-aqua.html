<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype 9 — Glass Aqua</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#0b2233;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#a1c4fd,#c2e9fb 55%,#d4fc79)}
.app{max-width:1100px;margin:0 auto;padding:32px;display:grid;grid-template-columns:1.35fr 1fr;grid-template-areas:"hd hd" "viz panel" "metrics panel";gap:22px 26px}.hd{grid-area:hd}.viz{grid-area:viz}.panel{grid-area:panel}.metrics{grid-area:metrics}@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-areas:"hd" "metrics" "viz" "panel"}}
h1{margin:0;font-size:22px;font-weight:700;color:#0b2233}
.sub{margin:4px 0 0;color:#325a72;font-size:13px}
.metrics{display:flex;gap:14px;flex-wrap:wrap}
.m{flex:1;min-width:120px;background:rgba(255,255,255,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(11,34,51,.12)}
.mlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#3f6b85}
.m b{display:block;margin-top:5px;font-size:23px;font-weight:700;color:#0369a1}
#mRatioTag{font-size:11px}#mRatioTag[data-ok=true]{color:#047857}#mRatioTag[data-ok=false]{color:#be123c}
.viz,.panel{background:rgba(255,255,255,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.6);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(11,34,51,.12)}
svg{width:100%;height:auto;display:block}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#3f6b85;margin:16px 0 6px}
.chead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.clab{font-size:12px;color:#325a72}
select{display:block;margin-top:6px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:7px 10px;font:inherit;color:#0b2233}
button{background:linear-gradient(90deg,#0ea5e9,#22d3ee);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(14,165,233,.4)}
#optmsg{font-size:11px;color:#325a72;margin-left:8px}
.ctls{display:grid;grid-template-columns:1fr;gap:2px}
label{display:block;font-size:12px;color:#325a72;margin-top:12px}
label .v{float:right;color:#0369a1;font-weight:600}
input[type=range]{width:100%;margin-top:7px;accent-color:#0ea5e9}
.ground{stroke:#9cc;stroke-dasharray:3 4}.cont{fill:none;stroke:#5a89a3;stroke-width:1.4}
.door{stroke:#0b2233;stroke-width:3;stroke-linecap:round}.brkt{stroke:#0369a1;stroke-width:2}
.post{stroke:#3f6b85;stroke-width:2}.cyl{stroke:#0ea5e9;stroke-width:3;stroke-linecap:round}
.hinge{fill:#0b2233}.cbase{fill:#0ea5e9}.att{fill:#be123c}.cg{fill:#7c3aed}
.grav{stroke:#be123c;stroke-width:1.5}.grav-h{fill:#be123c}
.fline{fill:none;stroke:#0369a1;stroke-width:1.9}.mk{fill:#be123c}
</style></head><body>

<div class="app">
  <header class="hd">
    <h1>Container Wall Actuator</h1>
    <p class="sub">glass aqua · prototype 9</p>
  </header>
  <section class="metrics">
    <div class="m"><span class="mlabel">Peak force</span><b><span id="mPeak"></span> N/kg</b></div>
    <div class="m"><span class="mlabel">Force @ &theta;</span><b><span id="mHere"></span> N/kg</b></div>
    <div class="m"><span class="mlabel">Stroke</span><b><span id="mStroke"></span> m</b></div>
    <div class="m"><span class="mlabel">Stroke ratio</span><b><span id="mRatio"></span></b> <span id="mRatioTag"></span></div>
  </section>
  <section class="viz">
    <svg id="diagram"></svg>
    <div class="cap">Piston force vs. wall angle</div>
    <svg id="spark"></svg>
  </section>
  <section class="panel">
    <div class="chead">
      <label class="clab">Container
        <select id="container"><option>Standard</option><option>High-Cube</option></select></label>
      <div class="optwrap"><button id="optimize">Optimize &rarr;</button><span id="optmsg"></span></div>
    </div>
    <div class="ctls">
      <label>a &mdash; floor position <span class="v" id="va"></span><input type="range" id="a" min="0.05" max="1.219" step="0.01"></label>
      <label>x_cg &mdash; cg along wall <span class="v" id="vxcg"></span><input type="range" id="xcg" min="0" max="2.896" step="0.01"></label>
      <label>b &mdash; attachment along wall <span class="v" id="vb"></span><input type="range" id="b" min="0.05" max="2.896" step="0.01"></label>
      <label>z_cg &mdash; cg off wall <span class="v" id="vzcg"></span><input type="range" id="zcg" min="0" max="1.5" step="0.01"></label>
      <label>d &mdash; bracket offset <span class="v" id="vd"></span><input type="range" id="d" min="0" max="1" step="0.01"></label>
      <label>&theta; &mdash; wall angle <span class="v" id="vtheta"></span><input type="range" id="theta" min="0" max="90" step="1"></label>
      <label>f &mdash; base height <span class="v" id="vf"></span><input type="range" id="f" min="0" max="2.896" step="0.01"></label>
    </div>
  </section>
</div>
<script src="engine.js"></script></body></html>
