<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype 12 — Swiss Grid</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif}
.app{max-width:960px;margin:0 auto;padding:34px 24px 80px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.5px}
.sub{margin:4px 0 22px;color:#e2231a;font-size:12px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid #111}
.m{padding:14px 14px 14px 0;border-bottom:2px solid #111}
.mlabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#777}
.m b{display:block;margin-top:8px;font-size:26px;font-weight:700}
#mRatioTag{font-size:11px}#mRatioTag[data-ok=true]{color:#111}#mRatioTag[data-ok=false]{color:#e2231a}
svg{width:100%;height:auto;display:block}
.viz{margin-top:22px}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#777;margin:22px 0 6px;border-top:1px solid #ddd;padding-top:8px}
.panel{margin-top:20px;border-top:2px solid #111;padding-top:16px}
.chead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.clab{font-size:12px;text-transform:uppercase;letter-spacing:.05em}
select{display:block;margin-top:6px;background:#fff;border:1px solid #111;padding:7px 9px;font:inherit;border-radius:0}
button{background:#e2231a;color:#fff;border:0;padding:11px 22px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-radius:0}
#optmsg{font-size:11px;color:#777;margin-left:10px}
.ctls{display:grid;grid-template-columns:1fr 1fr;gap:2px 40px;margin-top:14px}
label{display:block;font-size:12px;margin-top:14px;color:#333}
label .v{float:right;font-weight:700;color:#111}
input[type=range]{width:100%;margin-top:6px;accent-color:#e2231a}
.ground{stroke:#ddd;stroke-dasharray:3 4}.cont{fill:none;stroke:#111;stroke-width:1.4}
.door{stroke:#111;stroke-width:3}.brkt{stroke:#111;stroke-width:2}
.post{stroke:#555;stroke-width:2}.cyl{stroke:#e2231a;stroke-width:3}
.hinge{fill:#111}.cbase{fill:#e2231a}.att{fill:#111}.cg{fill:#111}
.grav{stroke:#111;stroke-width:1.4}.grav-h{fill:#111}
.fline{fill:none;stroke:#111;stroke-width:1.6}.mk{fill:#e2231a}
</style></head><body>

<div class="app">
  <header class="hd">
    <h1>Container Wall Actuator</h1>
    <p class="sub">swiss grid · prototype 12</p>
  </header>
  <section class="metrics">
    <div class="m"><span class="mlabel">Peak force</span><b><span id="mPeak"></span> N/kg</b></div>
    <div class="m"><span class="mlabel">Force @ &theta;</span><b><span id="mHere"></span> N/kg</b></div>
    <div class="m"><span class="mlabel">Stroke</span><b><span id="mStroke"></span> m</b></div>
    <div class="m"><span class="mlabel">Stroke ratio</span><b><span id="mRatio"></span></b> <span id="mRatioTag"></span></div>
  </section>
  <section class="viz">
    <svg id="diagram"></svg>
    <div class="cap">Piston force vs. wall angle</div>
    <svg id="spark"></svg>
  </section>
  <section class="panel">
    <div class="chead">
      <label class="clab">Container
        <select id="container"><option>Standard</option><option>High-Cube</option></select></label>
      <div class="optwrap"><button id="optimize">Optimize &rarr;</button><span id="optmsg"></span></div>
    </div>
    <div class="ctls">
      <label>a &mdash; floor position <span class="v" id="va"></span><input type="range" id="a" min="0.05" max="1.219" step="0.01"></label>
      <label>x_cg &mdash; cg along wall <span class="v" id="vxcg"></span><input type="range" id="xcg" min="0" max="2.896" step="0.01"></label>
      <label>b &mdash; attachment along wall <span class="v" id="vb"></span><input type="range" id="b" min="0.05" max="2.896" step="0.01"></label>
      <label>z_cg &mdash; cg off wall <span class="v" id="vzcg"></span><input type="range" id="zcg" min="0" max="1.5" step="0.01"></label>
      <label>d &mdash; bracket offset <span class="v" id="vd"></span><input type="range" id="d" min="0" max="1" step="0.01"></label>
      <label>&theta; &mdash; wall angle <span class="v" id="vtheta"></span><input type="range" id="theta" min="0" max="90" step="1"></label>
      <label>f &mdash; base height <span class="v" id="vf"></span><input type="range" id="f" min="0" max="2.896" step="0.01"></label>
    </div>
  </section>
</div>
<script src="engine.js"></script></body></html>
