<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype 5 — Warm Studio</title>
<style>
  :root{--acc:#ea580c;--bg:#fdf6ec;--card:#fffaf3;--ink:#4a3728;--line:#f0e2cf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins",Avenir,system-ui,sans-serif}
  header{padding:20px 30px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:800}
  header h1{margin:0;font-size:19px} header p{margin:0;color:#a68a6d;font-size:12px}
  .wrap{display:grid;grid-template-columns:330px 1fr;gap:20px;padding:8px 30px 40px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 30px -20px rgba(74,55,40,.4)}
  h3{margin:4px 0 10px;font-size:13px;color:#b08968;text-transform:uppercase;letter-spacing:.05em}
  select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--ink);font-family:inherit}
  .ctl{display:flex;justify-content:space-between;font-size:14px;margin:16px 0 4px}
  .val{font-weight:700;color:var(--acc)}
  input[type=range]{width:100%;height:8px;accent-color:var(--acc)}
  button{width:100%;margin-top:20px;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;box-shadow:0 10px 20px -8px rgba(234,88,12,.5)}
  #optmsg{display:block;text-align:center;color:var(--acc);font-size:12px;margin-top:10px;min-height:16px}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
  .pill small{color:#b08968;font-size:12px}.pill b{display:block;font-size:26px;margin-top:4px}
  #mRatioTag{font-size:11px}#mRatioTag[data-ok=true]{color:#16a34a}#mRatioTag[data-ok=false]{color:#dc2626}
  h4{margin:0 0 10px;color:#b08968;font-size:14px}
  .viz{display:grid;gap:20px}
  svg{width:100%;height:auto;display:block}
  .ground{stroke:#efdcc3;stroke-dasharray:5 5}.cont{fill:none;stroke:#d9bfa0;stroke-width:3}
  .door{stroke:#6b4a2f;stroke-width:6;stroke-linecap:round}.brkt{stroke:#6b4a2f;stroke-width:4}
  .post{stroke:#6b4a2f;stroke-width:4}.cyl{stroke:var(--acc);stroke-width:5;stroke-linecap:round}
  .hinge{fill:#6b4a2f}.cbase{fill:var(--acc)}.att{fill:#dc2626}.cg{fill:#2563eb}
  .grav{stroke:#2563eb;stroke-width:2}.grav-h{fill:#2563eb}
  .fline{fill:none;stroke:var(--acc);stroke-width:3}.mk{fill:#dc2626}
</style></head><body>
<header><div class="logo">W</div><div><h1>Container wall actuator</h1><p>Warm Studio · prototype 5</p></div></header>
<div class="wrap">
  <div class="card">
    <h3>Setup</h3>
    <select id="container"><option>Standard</option><option>High-Cube</option></select>
    <div class="ctl"><span>x_cg</span><span class="val" id="vxcg"></span></div><input type="range" id="xcg" min="0" max="2.896" step="0.01">
    <div class="ctl"><span>z_cg</span><span class="val" id="vzcg"></span></div><input type="range" id="zcg" min="0" max="1.5" step="0.01">
    <h3>Geometry</h3>
    <div class="ctl"><span>a — floor position</span><span class="val" id="va"></span></div><input type="range" id="a" min="0.05" max="1.219" step="0.01">
    <div class="ctl"><span>b — along wall</span><span class="val" id="vb"></span></div><input type="range" id="b" min="0.05" max="2.896" step="0.01">
    <div class="ctl"><span>d — bracket</span><span class="val" id="vd"></span></div><input type="range" id="d" min="0" max="1" step="0.01">
    <div class="ctl"><span>f — base height</span><span class="val" id="vf"></span></div><input type="range" id="f" min="0" max="2.896" step="0.01">
    <div class="ctl"><span>θ wall angle</span><span class="val" id="vtheta"></span></div><input type="range" id="theta" min="0" max="90" step="1">
    <button id="optimize">✦ Optimize geometry</button><span id="optmsg"></span>
  </div>
  <div>
    <div class="metrics">
      <div class="pill"><small>Peak force</small><b id="mPeak"></b><small>N/kg</small></div>
      <div class="pill"><small>Force at θ</small><b id="mHere"></b><small>N/kg</small></div>
      <div class="pill"><small>Stroke</small><b id="mStroke"></b><small>m</small></div>
      <div class="pill"><small>Stroke ratio</small><b id="mRatio"></b><span id="mRatioTag"></span></div>
    </div>
    <div class="viz">
      <div class="card"><h4>Side view</h4><svg id="diagram"></svg></div>
      <div class="card"><h4>Piston force vs. wall angle</h4><svg id="spark"></svg></div>
    </div>
  </div>
</div>
<script src="engine.js"></script></body></html>
