<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype 11 — Neumorphic</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e6e9ef;color:#4a5568;font-family:system-ui,-apple-system,sans-serif}
.app{max-width:940px;margin:0 auto;padding:36px 24px 80px}
h1{margin:0;font-size:21px;font-weight:700;color:#3a4256}
.sub{margin:4px 0 24px;color:#9aa3b5;font-size:13px}
.metrics{display:flex;gap:16px;flex-wrap:wrap}
.m{flex:1;min-width:120px;background:#e6e9ef;border-radius:16px;padding:16px;box-shadow:6px 6px 12px #c5c9d2,-6px -6px 12px #ffffff}
.mlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9aa3b5}
.m b{display:block;margin-top:6px;font-size:23px;font-weight:700;color:#5b7cfa}
#mRatioTag{font-size:11px}#mRatioTag[data-ok=true]{color:#2f9e6f}#mRatioTag[data-ok=false]{color:#e2698f}
.viz,.panel{background:#e6e9ef;border-radius:20px;padding:20px;margin-top:20px;box-shadow:8px 8px 16px #c5c9d2,-8px -8px 16px #ffffff}
svg{width:100%;height:auto;display:block}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#9aa3b5;margin:16px 0 6px}
.chead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.clab{font-size:12px;color:#6b7280}
select{display:block;margin-top:6px;background:#e6e9ef;color:#4a5568;border:0;border-radius:10px;padding:8px 10px;font:inherit;box-shadow:inset 3px 3px 6px #c5c9d2,inset -3px -3px 6px #fff}
button{background:#5b7cfa;color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:600;font-size:13px;cursor:pointer;box-shadow:5px 5px 10px #c5c9d2,-5px -5px 10px #fff}
#optmsg{font-size:11px;color:#9aa3b5;margin-left:8px}
.ctls{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
label{display:block;font-size:12px;color:#6b7280;margin-top:14px}
label .v{float:right;color:#5b7cfa;font-weight:600}
input[type=range]{width:100%;margin-top:7px;accent-color:#5b7cfa}
.ground{stroke:#cfd4de;stroke-dasharray:3 4}.cont{fill:none;stroke:#a9b0c0;stroke-width:1.4}
.door{stroke:#3a4256;stroke-width:3;stroke-linecap:round}.brkt{stroke:#5b7cfa;stroke-width:2}
.post{stroke:#8892a6;stroke-width:2}.cyl{stroke:#5b7cfa;stroke-width:3;stroke-linecap:round}
.hinge{fill:#3a4256}.cbase{fill:#5b7cfa}.att{fill:#e2698f}.cg{fill:#7c5cfa}
.grav{stroke:#e2698f;stroke-width:1.5}.grav-h{fill:#e2698f}
.fline{fill:none;stroke:#5b7cfa;stroke-width:1.9}.mk{fill:#e2698f}
</style></head><body>

<div class="app">
  <header class="hd">
    <h1>Container Wall Actuator</h1>
    <p class="sub">neumorphic · prototype 11</p>
  </header>
  <section class="metrics">
    <div class="m"><span class="mlabel">Peak force</span><b><span id="mPeak"></span> N/kg</b></div>
    <div class="m"><span class="mlabel">Force @ &theta;</span><b><span id="mHere"></span> N/kg</b></div>
    <div class="m"><span class="mlabel">Stroke</span><b><span id="mStroke"></span> m</b></div>
    <div class="m"><span class="mlabel">Stroke ratio</span><b><span id="mRatio"></span></b> <span id="mRatioTag"></span></div>
  </section>
  <section class="viz">
    <svg id="diagram"></svg>
    <div class="cap">Piston force vs. wall angle</div>
    <svg id="spark"></svg>
  </section>
  <section class="panel">
    <div class="chead">
      <label class="clab">Container
        <select id="container"><option>Standard</option><option>High-Cube</option></select></label>
      <div class="optwrap"><button id="optimize">Optimize &rarr;</button><span id="optmsg"></span></div>
    </div>
    <div class="ctls">
      <label>a &mdash; floor position <span class="v" id="va"></span><input type="range" id="a" min="0.05" max="1.219" step="0.01"></label>
      <label>x_cg &mdash; cg along wall <span class="v" id="vxcg"></span><input type="range" id="xcg" min="0" max="2.896" step="0.01"></label>
      <label>b &mdash; attachment along wall <span class="v" id="vb"></span><input type="range" id="b" min="0.05" max="2.896" step="0.01"></label>
      <label>z_cg &mdash; cg off wall <span class="v" id="vzcg"></span><input type="range" id="zcg" min="0" max="1.5" step="0.01"></label>
      <label>d &mdash; bracket offset <span class="v" id="vd"></span><input type="range" id="d" min="0" max="1" step="0.01"></label>
      <label>&theta; &mdash; wall angle <span class="v" id="vtheta"></span><input type="range" id="theta" min="0" max="90" step="1"></label>
      <label>f &mdash; base height <span class="v" id="vf"></span><input type="range" id="f" min="0" max="2.896" step="0.01"></label>
    </div>
  </section>
</div>
<script src="engine.js"></script></body></html>
