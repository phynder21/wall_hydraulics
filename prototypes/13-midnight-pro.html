<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype 13 — Midnight Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#c9d2e3;font-family:Georgia,"Times New Roman",serif}
.app{max-width:1100px;margin:0 auto;padding:32px;display:grid;grid-template-columns:1.35fr 1fr;grid-template-areas:"hd hd" "viz panel" "metrics panel";gap:22px 26px}.hd{grid-area:hd}.viz{grid-area:viz}.panel{grid-area:panel}.metrics{grid-area:metrics}@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-areas:"hd" "metrics" "viz" "panel"}}
h1{margin:0;font-size:24px;font-weight:700;color:#f4e9c8;letter-spacing:.02em}
.sub{margin:5px 0 0;color:#7d879b;font-size:13px;font-style:italic}
.metrics{display:flex;gap:14px;flex-wrap:wrap}
.m{flex:1;min-width:120px;background:#131c2e;border:1px solid #26324a;border-top:2px solid #d4af37;border-radius:6px;padding:14px 16px}
.mlabel{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#7d879b;font-family:Helvetica,Arial,sans-serif}
.m b{display:block;margin-top:6px;font-size:24px;font-weight:700;color:#d4af37}
#mRatioTag{font-size:11px}#mRatioTag[data-ok=true]{color:#5fbf8a}#mRatioTag[data-ok=false]{color:#e0736f}
.viz,.panel{background:#131c2e;border:1px solid #26324a;border-radius:8px;padding:18px}
svg{width:100%;height:auto;display:block}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#7d879b;margin:16px 0 6px;font-family:Helvetica,Arial,sans-serif}
.chead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.clab{font-size:12px;color:#9aa3b8}
select{display:block;margin-top:6px;background:#0b1220;color:#c9d2e3;border:1px solid #2c3a56;border-radius:6px;padding:7px 10px;font:inherit}
button{background:#d4af37;color:#0b1220;border:0;border-radius:6px;padding:10px 20px;font-family:Helvetica,Arial,sans-serif;font-weight:700;font-size:13px;cursor:pointer}
#optmsg{font-size:11px;color:#7d879b;margin-left:8px;font-family:Helvetica,Arial,sans-serif}
.ctls{display:grid;grid-template-columns:1fr;gap:2px}
label{display:block;font-size:12px;color:#9aa3b8;margin-top:12px;font-family:Helvetica,Arial,sans-serif}
label .v{float:right;color:#d4af37;font-weight:700}
input[type=range]{width:100%;margin-top:7px;accent-color:#d4af37}
.ground{stroke:#26324a;stroke-dasharray:3 4}.cont{fill:none;stroke:#3a4a6a;stroke-width:1.4}
.door{stroke:#e6ecf7;stroke-width:3;stroke-linecap:round}.brkt{stroke:#d4af37;stroke-width:2}
.post{stroke:#7d879b;stroke-width:2}.cyl{stroke:#d4af37;stroke-width:3;stroke-linecap:round}
.hinge{fill:#e6ecf7}.cbase{fill:#d4af37}.att{fill:#e0736f}.cg{fill:#8fb0e0}
.grav{stroke:#e0736f;stroke-width:1.5}.grav-h{fill:#e0736f}
.fline{fill:none;stroke:#d4af37;stroke-width:1.9}.mk{fill:#e0736f}
</style></head><body>

<div class="app">
  <header class="hd">
    <h1>Container Wall Actuator</h1>
    <p class="sub">midnight pro · prototype 13</p>
  </header>
  <section class="metrics">
    <div class="m"><span class="mlabel">Peak force</span><b><span id="mPeak"></span> N/kg</b></div>
    <div class="m"><span class="mlabel">Force @ &theta;</span><b><span id="mHere"></span> N/kg</b></div>
    <div class="m"><span class="mlabel">Stroke</span><b><span id="mStroke"></span> m</b></div>
    <div class="m"><span class="mlabel">Stroke ratio</span><b><span id="mRatio"></span></b> <span id="mRatioTag"></span></div>
  </section>
  <section class="viz">
    <svg id="diagram"></svg>
    <div class="cap">Piston force vs. wall angle</div>
    <svg id="spark"></svg>
  </section>
  <section class="panel">
    <div class="chead">
      <label class="clab">Container
        <select id="container"><option>Standard</option><option>High-Cube</option></select></label>
      <div class="optwrap"><button id="optimize">Optimize &rarr;</button><span id="optmsg"></span></div>
    </div>
    <div class="ctls">
      <label>a &mdash; floor position <span class="v" id="va"></span><input type="range" id="a" min="0.05" max="1.219" step="0.01"></label>
      <label>x_cg &mdash; cg along wall <span class="v" id="vxcg"></span><input type="range" id="xcg" min="0" max="2.896" step="0.01"></label>
      <label>b &mdash; attachment along wall <span class="v" id="vb"></span><input type="range" id="b" min="0.05" max="2.896" step="0.01"></label>
      <label>z_cg &mdash; cg off wall <span class="v" id="vzcg"></span><input type="range" id="zcg" min="0" max="1.5" step="0.01"></label>
      <label>d &mdash; bracket offset <span class="v" id="vd"></span><input type="range" id="d" min="0" max="1" step="0.01"></label>
      <label>&theta; &mdash; wall angle <span class="v" id="vtheta"></span><input type="range" id="theta" min="0" max="90" step="1"></label>
      <label>f &mdash; base height <span class="v" id="vf"></span><input type="range" id="f" min="0" max="2.896" step="0.01"></label>
    </div>
  </section>
</div>
<script src="engine.js"></script></body></html>
